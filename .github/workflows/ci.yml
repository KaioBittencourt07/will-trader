name: WILL CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: will-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/api.js && node --check dashboard/app.js

      - name: Run root regression suite
        run: npm test

      - name: Run backend-local regression suite
        run: npm --prefix backend test -- --test-concurrency=2 --test-timeout=60000 --test-force-exit
